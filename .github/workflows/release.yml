# Builds the installer and publishes it as a GitHub release whenever the version in
# src/version.py goes up on main (and there's no release for it yet). The app's updater
# then finds it by itself. It can also be started by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: [src/version.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Which version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/version.py)"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --json assets --jq '.assets[].name' 2>/dev/null | grep -qi 'setup.exe$'; then
            echo "v$V is already released."
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the build tools
        if: steps.version.outputs.skip != 'yes'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis wine64 unzip

      - name: Build the installer
        if: steps.version.outputs.skip != 'yes'
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine" WINE=/usr/lib/wine/wine64
          bash build/build.sh

      - name: Publish the release
        if: steps.version.outputs.skip != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 build/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/Ultimate Recording Setup.exe" --clobber
          else
            gh release create "$TAG" "dist/Ultimate Recording Setup.exe" --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
