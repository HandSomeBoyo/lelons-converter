# Builds the installer and publishes it as a GitHub release whenever a version tag
# (like v1.32.0) is pushed. The app's updater then finds it by itself.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to (re)build, like v1.32.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the version matches the tag
        run: |
          V="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/version.py)"
          [ "v$V" = "$TAG" ] || { echo "src/version.py says $V but the tag is $TAG"; exit 1; }

      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis wine64 unzip

      - name: Build the installer
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine" WINE=/usr/lib/wine/wine64
          bash build/build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/Ultimate Recording Setup.exe" --clobber
          else
            gh release create "$TAG" "dist/Ultimate Recording Setup.exe" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
