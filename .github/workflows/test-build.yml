# A test installer for trying out a branch before it's released. Builds on every
# push to the branch below and keeps the installer as a download on the run
# (nothing is published). Remove this file before merging to main.
name: Test build

on:
  push:
    branches: [claude/project-thread-kg6pbd]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis wine64 unzip
      - name: Build the installer
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine" WINE=/usr/lib/wine/wine64
          bash build/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VaultHub-test-setup
          path: dist/VaultHub Setup.exe
          retention-days: 7
