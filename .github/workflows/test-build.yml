# TEST ONLY (input overlay branch): builds the installer as a download, without publishing. Remove before merging.
name: Test build
on:
  push:
    branches: [claude/project-thread-ibz8pz]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          for i in 1 2 3; do
            sudo timeout 300 apt-get update -q && sudo timeout 600 apt-get install -y -q nsis wine64 unzip && break
            echo "apt got stuck, trying again"; sleep 10
          done
      - name: Build the installer
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine" WINE=/usr/lib/wine/wine64
          bash build/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VaultHub Setup (test)
          path: dist/VaultHub Setup.exe
          retention-days: 14
