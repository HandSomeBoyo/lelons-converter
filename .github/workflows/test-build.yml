# Builds the installer to try out, without releasing it: on every push to a claude/ branch, or by hand
# from the Actions tab. The installer is kept for 14 days as a download on the run's page (Artifacts).
# Nobody gets it as an update; only release.yml (version goes up on main) publishes.
name: Test build

on:
  push:
    branches: ["claude/**"]
    paths: ["src/**", "installer/**", "build/**", "assets/**", ".github/workflows/test-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis wine64 unzip

      - name: Build the installer
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine" WINE=/usr/lib/wine/wine64
          bash build/build.sh

      - name: Keep the installer as a download
        uses: actions/upload-artifact@v4
        with:
          name: VaultHub Setup (test)
          path: dist/VaultHub Setup.exe
          retention-days: 14
