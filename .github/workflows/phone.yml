# Puts the phone app (the phone/ folder) online with GitHub Pages:
# https://handsomeboyo.github.io/lelons-converter/
# Needs Settings > Pages > Source set to "GitHub Actions" once.
name: Phone app

on:
  push:
    branches: [main]
    paths: [phone/**, .github/workflows/phone.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone
      - id: deployment
        uses: actions/deploy-pages@v4
