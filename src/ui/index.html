<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lelons Converter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="logo">
    <svg viewBox="0 0 78 86" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4b93ff"/><stop offset="1" stop-color="#1663f0"/>
        </linearGradient>
      </defs>
      <path d="M16 70V14L64 43L36 60" fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="wordmark">
      <div class="name">Lelons</div>
      <div class="sub">CONVERTER</div>
    </div>
  </div>

  <p class="tagline">Convert YouTube videos to MP3 or MP4.</p>

  <section class="card">
    <div class="options">
    <div class="toggle" id="toggle">
      <div class="pill"></div>
      <button class="active" data-format="mp3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        MP3
      </button>
      <button data-format="mp4">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M10 9v6l5-3z" fill="currentColor"/></svg>
        MP4
      </button>
    </div>
    <label class="quality" title="Quality">
      <select id="quality" aria-label="Quality"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </label>
    </div>

    <form class="row" id="form">
      <label class="input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        <input id="url" placeholder="Paste YouTube link here..." autocomplete="off" spellcheck="false" autofocus>
      </label>
      <button class="convert" id="convert" type="submit">
        Convert
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="preview" id="preview">
      <div class="thumb" id="previewThumb"></div>
      <div class="info">
        <div class="title clamp" id="previewTitle"></div>
        <div class="meta"><span id="previewMeta"></span><button type="button" class="link-button trim-toggle" id="trimToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg>
          Trim</button></div>
        <div class="trim-chip" id="trimChip" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg>
          <button type="button" class="link-button" id="trimEdit" title="Change the trim"></button>
          <button type="button" class="icon-button" id="trimClear" title="Don't trim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <div class="footer">
    <span>Saving to <strong id="folder">Downloads</strong> · <button id="change">Change</button></span>
    <span><span id="version"></span> ·
      <label class="check" title="Look for updates every time the app opens"><input type="checkbox" id="autoUpdate"> Auto-update</label> ·
      <button id="checkNow">Check for updates</button></span>
  </div>

  <div class="notice" id="notice"></div>

  <section class="queue" id="queue">
    <div class="queue-head">
      <h2>Downloads</h2>
      <button class="link-button" id="clear">Clear finished</button>
    </div>
    <div class="jobs" id="jobs"></div>
  </section>

</main>

<!-- Trim editor: drag the two lines on the waveform to pick the part to keep -->
<div class="modal" id="trimModal" hidden>
  <div class="dialog trim-dialog" role="dialog" aria-labelledby="trimHeading">
    <h2 id="trimHeading">Trim</h2>
    <p class="sub" id="trimSub">Drag the lines to where the part you want starts and ends.</p>
    <div class="wave" id="wave">
      <canvas id="waveCanvas"></canvas>
      <div class="shade" id="shadeLeft"></div>
      <div class="shade" id="shadeRight"></div>
      <div class="handle" id="handleStart"><span>Start</span></div>
      <div class="handle" id="handleEnd"><span>End</span></div>
      <div class="playhead" id="playhead" hidden></div>
      <div class="wave-message" id="waveMessage"></div>
    </div>
    <div class="ruler"><span>0:00</span><span id="rulerEnd"></span></div>
    <div class="trim-controls">
      <label>Start <input id="trimStart" autocomplete="off" spellcheck="false"></label>
      <button type="button" class="play-button" id="trimPlay" title="Play the part you picked">
        <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <label>End <input id="trimEnd" autocomplete="off" spellcheck="false"></label>
    </div>
    <p class="trim-length" id="trimLength"></p>
    <div class="dialog-actions">
      <button type="button" class="link-button" id="trimReset">Select all</button>
      <span class="spacer"></span>
      <button type="button" class="ghost-button" id="trimCancel">Cancel</button>
      <button type="button" class="small-button" id="trimDone">Done</button>
    </div>
  </div>
</div>
<audio id="trimAudio" preload="auto"></audio>

<!-- Update popup -->
<div class="modal" id="updateModal" hidden>
  <div class="dialog update-dialog" role="dialog" aria-labelledby="updateHeading">
    <img src="/icon.png" alt="" class="update-icon">
    <h2 id="updateHeading">Update available</h2>
    <p class="sub" id="updateText"></p>
    <div class="bar" id="updateBar" hidden><div></div></div>
    <div class="dialog-actions" id="updateActions">
      <span class="spacer"></span>
      <button type="button" class="ghost-button" id="updateLater">Later</button>
      <button type="button" class="small-button" id="updateInstall">Install update</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
