<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lelons Converter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></div>
      <div class="word">Lelons <span>Converter</span></div>
    </div>
    <div class="where">Saving to <strong id="folder">Downloads</strong> · <button class="link" id="change">Change</button></div>
  </header>

  <h1 class="headline">Paste a link.<br><em>Get the file.</em></h1>

  <form class="row" id="form">
    <label class="input">
      <input id="url" placeholder="Paste a YouTube link here" autocomplete="off" spellcheck="false" autofocus>
    </label>
    <button class="convert" id="convert" type="submit">
      Convert
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="options">
    <div class="toggle" id="toggle">
      <button class="active" data-format="mp3">MP3</button>
      <button data-format="mp4">MP4</button>
    </div>
    <label class="quality">
      <span>Quality</span>
      <select id="quality" aria-label="Quality"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </label>
  </div>

  <div class="preview" id="preview">
    <div class="thumb" id="previewThumb"></div>
    <div class="info">
      <div class="title clamp" id="previewTitle"></div>
      <div class="meta" id="previewMeta"></div>
      <div class="trim-chip" id="trimChip" hidden>
        <button type="button" class="link" id="trimEdit" title="Change the trim"></button>
        <button type="button" class="icon-button" id="trimClear" title="Don't trim">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <button type="button" class="outline-button trim-toggle" id="trimToggle">Trim</button>
  </div>

  <div class="notice" id="notice"></div>

  <section class="queue" id="queue">
    <div class="queue-head">
      <h2>Downloads</h2>
      <button class="link" id="clear">Clear finished</button>
    </div>
    <div class="jobs" id="jobs"></div>
  </section>

  <footer class="footer">
    <span id="version"></span>
    <span>
      <label class="check" title="Look for updates every time the app opens"><input type="checkbox" id="autoUpdate"> Update automatically</label> ·
      <button class="link" id="checkNow">Check for updates</button>
    </span>
  </footer>
</main>

<!-- Trim editor: drag the two lines on the waveform to pick the part to keep -->
<div class="modal" id="trimModal" hidden>
  <div class="dialog trim-dialog" role="dialog" aria-labelledby="trimHeading">
    <h2 id="trimHeading">Trim</h2>
    <p class="sub" id="trimSub"></p>
    <div class="video-box" id="videoBox" hidden>
      <video id="trimVideo" playsinline preload="auto"></video>
      <div class="video-time" id="videoTime"></div>
    </div>
    <div class="wave" id="wave">
      <canvas id="waveCanvas"></canvas>
      <div class="shade" id="shadeLeft"></div>
      <div class="shade" id="shadeRight"></div>
      <div class="handle" id="handleStart"><span>Start</span></div>
      <div class="handle" id="handleEnd"><span>End</span></div>
      <div class="playhead" id="playhead" hidden></div>
      <div class="wave-message" id="waveMessage"></div>
    </div>
    <div class="ruler"><span>0:00</span><span id="rulerEnd"></span></div>
    <div class="trim-controls">
      <label>Start <input id="trimStart" autocomplete="off" spellcheck="false"></label>
      <button type="button" class="play-button" id="trimPlay" title="Play the part you picked">
        <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <label>End <input id="trimEnd" autocomplete="off" spellcheck="false"></label>
    </div>
    <p class="trim-length" id="trimLength"></p>
    <div class="dialog-actions">
      <button type="button" class="link-button" id="trimReset">Select all</button>
      <span class="spacer"></span>
      <button type="button" class="ghost-button" id="trimCancel">Cancel</button>
      <button type="button" class="small-button" id="trimDone">Done</button>
    </div>
  </div>
</div>
<audio id="trimAudio" preload="auto"></audio>

<!-- Update popup -->
<div class="modal" id="updateModal" hidden>
  <div class="dialog update-dialog" role="dialog" aria-labelledby="updateHeading">
    <img src="/icon.png" alt="" class="update-icon">
    <h2 id="updateHeading">Update available</h2>
    <p class="sub" id="updateText"></p>
    <div class="bar" id="updateBar" hidden><div></div></div>
    <div class="dialog-actions" id="updateActions">
      <span class="spacer"></span>
      <button type="button" class="ghost-button" id="updateLater">Later</button>
      <button type="button" class="small-button" id="updateInstall">Install update</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
